name: release-packages

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-binary:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Go 1.27.3
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.3

      - name: build-linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        if: matrix.os == 'ubuntu-latest'
        run: CGO_ENABLED=0 go build -ldflags '-s -w' -v -o ./dmp && tar zcf dmp.tgz dmp

      - name: build-darwin
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        if: matrix.os == 'macos-latest'
        run: CGO_ENABLED=0 go build -ldflags '-s -w' -v -o ./dmp && tar zcf dmp_darwin.tgz dmp

      - name: build-lite
        if: matrix.os == 'ubuntu-latest'
        run: |
          CGO_ENABLED=0 go build -ldflags '-s -w' -v -tags=lite -o ./dmp-lite
          mkdir -p lite-package
          cp dmp-lite lite-package/
          cp -r lite/dist-lite lite-package/dist-lite
          cp embedFS/shell/manual_install.sh embedFS/shell/manual_update.sh lite-package/
          cp lite/run.sh lite-package/run.sh
          chmod 755 lite-package/dmp-lite lite-package/manual_install.sh lite-package/manual_update.sh lite-package/run.sh
          tar zcf dmp-lite.tgz -C lite-package dmp-lite dist-lite manual_install.sh manual_update.sh run.sh
          rm -rf lite-package

      - name: release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./*.tgz

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Package Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          file: ./docker/Dockerfile
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
